[project]
name = "yolo26-drone-detection"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "imagehash>=4.3.2",
    "polars>=2.1.0",
    "pyyaml>=6.0.4",
    "scipy>=1.18.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.70.1",
    "ultralytics>=8.4.215",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
