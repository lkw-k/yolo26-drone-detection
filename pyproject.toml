[project]
name = "yolo26-drone-detection"
version = "0.1.0"
description = "YOLO26n / YOLO26s drone detector for ground-to-air and air-to-air scenarios"
requires-python = ">=3.11,<3.13"
dependencies = [
    "cloudpickle>=3.1.1",
    "huggingface-hub>=2.4.0",
    "imagehash>=4.3.2",
    "pandas>=3.1.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "ultralytics>=8.4.216",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
